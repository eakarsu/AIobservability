name: authoritative-contracts
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e sdk
      - run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_*.py'
        working-directory: backend
      - run: python -m compileall -q app scripts tests
        working-directory: backend
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py'
        working-directory: sdk
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci
        working-directory: dashboard
      - run: npm audit --omit=dev --audit-level=high
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
